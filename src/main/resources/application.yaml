# ==============================================================================
# BlueAnt CRM ERP Platform
# ==============================================================================
# Environment : Development / Production (Railway)
# Framework   : Spring Boot 3.3.x
# Java        : 21
# Version     : 1.0.0
# ==============================================================================

# ==============================================================================
# Server Configuration
# ==============================================================================

server:

  port: ${PORT:8080}

  servlet:
    context-path: /api

  shutdown: graceful

  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
      - text/css
      - application/javascript

# ==============================================================================
# Spring Configuration
# ==============================================================================

spring:

  application:
    name: blueant-crm-erp

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ============================================================================
  # Database
  # ============================================================================

  datasource:

    driver-class-name: com.mysql.cj.jdbc.Driver

    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:blueant_crm}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&nullCatalogMeansCurrent=true}

    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}

    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:root}}

    hikari:

      pool-name: BlueantHikariPool

      minimum-idle: 5
      maximum-pool-size: 20

      idle-timeout: 600000
      max-lifetime: 1800000

      connection-timeout: 30000
      validation-timeout: 5000

      auto-commit: false

      leak-detection-threshold: 60000

  # ============================================================================
  # Hibernate / JPA
  # ============================================================================

  jpa:

    open-in-view: false

    show-sql: true

    hibernate:
      ddl-auto: validate

    properties:

      hibernate:

        format_sql: true
        highlight_sql: true
        use_sql_comments: true

        jdbc:
          batch_size: 50

        order_inserts: true
        order_updates: true

        generate_statistics: false

  # ============================================================================
  # SQL Initialization
  # ============================================================================

  sql:

    init:
      mode: never

  # ============================================================================
  # Flyway Migration
  # ============================================================================

  flyway:

    enabled: true

    locations:
      - classpath:db/migration

    baseline-on-migrate: true
    validate-on-migrate: true

    # Production Safe Configuration
    clean-disabled: true
    clean-on-validation-error: false

  # ============================================================================
  # Redis
  # ============================================================================

  data:

    redis:

      repositories:
        enabled: false

      host: ${SPRING_DATA_REDIS_HOST:${REDISHOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDISPORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDISPASSWORD:}}

      timeout: 2s

      lettuce:

        pool:

          max-active: 16
          max-idle: 8
          min-idle: 2

  # ============================================================================
  # Cache
  # ============================================================================

  cache:

    type: redis

    redis:
      time-to-live: 86400000

  # ============================================================================
  # Mail
  # ============================================================================

  mail:

    host: ${SPRING_MAIL_HOST:smtp.gmail.com}

    port: ${SPRING_MAIL_PORT:587}

    username: ${MAIL_USERNAME:noreply@blueant.in}

    password: ${MAIL_PASSWORD:}

    properties:

      mail:

        smtp:

          auth: true

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

          starttls:
            enable: true
            required: true

  # ============================================================================
  # Jackson
  # ============================================================================

  jackson:

    time-zone: Asia/Kolkata

    date-format: yyyy-MM-dd HH:mm:ss

    serialization:
      write-dates-as-timestamps: false

    deserialization:
      fail-on-unknown-properties: false

# ==============================================================================
# OpenAPI / Swagger
# ==============================================================================

springdoc:

  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# ==============================================================================
# Application
# ==============================================================================

app:

  name: BlueAnt CRM ERP Platform

  version: 1.0.0

  support-email: support@blueant.in

  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  cors:

    allowed-origins:

      - ${FRONTEND_URL:http://localhost:3000}
      - http://localhost:5173
      - https://crm.blueant.in

# ==============================================================================
# JWT
# ==============================================================================

jwt:

  secret: ${JWT_SECRET:change-this-in-production}

  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ==============================================================================
# Lead Module
# ==============================================================================

lead:

  duplicate-inactive-days: 40

  max-leads-per-day-per-sm: 30

  followup-reminder-days: 1

  app-visible-delay-minutes: 5

# ==============================================================================
# Logging
# ==============================================================================

logging:

  level:

    root: INFO

    com.blueant_crm_erp: DEBUG

    org.springframework.security: INFO

    org.hibernate.SQL: DEBUG

    org.hibernate.orm.jdbc.bind: TRACE

    com.blueant_crm_erp.meeting.controller: DEBUG
    com.blueant_crm_erp.meeting.service: DEBUG
    com.blueant_crm_erp.meeting.mapper: DEBUG
    org.springframework.http.converter.json: DEBUG
    com.fasterxml.jackson: DEBUG

  pattern:

    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{40} - %msg%n"

  file:

    name: logs/blueant-crm-erp.log

# ==============================================================================
# Actuator Configuration
# ==============================================================================

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

# ==============================================================================
# AWS Configuration
# ==============================================================================

aws:
  s3:
    bucket:
      name: ${AWS_S3_BUCKET_NAME:blueant-documents}